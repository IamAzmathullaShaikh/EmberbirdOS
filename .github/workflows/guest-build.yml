name: guest-build

# Produces the M2 X2 artifact - the Android-x86_64 guest image - and records its
# provenance so X3-X5 (boot, usable UI, ADB liveness) can run on a Windows host
# against a known-good, hashed image.
#
# THE RECIPE LIVES IN THE REPO, NOT IN THIS FILE
#   tools/guest-build/build-from-manifest.sh is the one build recipe: it pins the
#   manifests checkout to the recorded revision, syncs, re-confirms the committed X1
#   lock with `repo manifest -r`, builds, and writes the X2 provenance record. This
#   workflow only decides WHERE that recipe runs. The same script is what the Crave
#   path runs remotely (docs/M2-CRAVE-BUILD.md), so the two cannot drift - and the
#   recipe is equally runnable by hand on any suitable machine.
#
# WHY THE BUILD IS MANUAL, AND WHY THERE ARE TWO MODES
#   A from-source sync+build needs ~250-400 GB, 16 GB+ RAM and hours of CPU. A standard
#   GitHub-hosted runner has ~14 GB free, so it cannot do this at all - it would die
#   inside `repo sync`. Hence:
#
#     mode=build-from-manifest   runs on a runner with the disk for it: a self-hosted
#                                runner, a GitHub larger runner, or (recommended, and
#                                what the owner chose) Crave - see
#                                docs/M2-CRAVE-BUILD.md for that path.
#
#     mode=prebuilt-provenance   runs on a stock hosted runner and records URL + SHA-256
#                                + size + retrieval time for a prebuilt the operator
#                                supplies and has reason to trust. Note the honest
#                                state of this option: as of 2026-09-24 there is no
#                                provenance-usable prebuilt in public (BlissOS's images
#                                are paused) - see
#                                docs/evidence/M2/x2-artifact-availability.txt - so this
#                                mode is for an operator-supplied artifact only, and any
#                                divergence from the pinned manifest must be recorded.
#
# Nothing here modifies the frozen M0 launcher, and nothing commits: the workflow
# uploads artifacts for the operator to verify, hash-compare and record under
# docs/evidence/M2/ (see docs/M2-GUEST-BOOT-PROOF.md sections 4.2 and 5).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'How to obtain the guest artifact'
        type: choice
        options:
          - prebuilt-provenance
          - build-from-manifest
        default: prebuilt-provenance
        required: true
      artifact_url:
        description: '(prebuilt-provenance) HTTPS URL of an operator-supplied guest image'
        type: string
        required: false
      runner_label:
        description: '(build-from-manifest) runs-on label; needs ~300+ GB free disk'
        type: string
        default: self-hosted
        required: false
      manifest_revision:
        description: 'Manifest revision to sync (defaults to the committed pin)'
        type: string
        default: ''
        required: false
      lunch_target:
        description: 'lunch target'
        type: string
        default: bliss_x86_64-userdebug
        required: false
      make_target:
        description: 'make target'
        type: string
        default: iso_img
        required: false

permissions:
  contents: read

concurrency:
  group: guest-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # mode=prebuilt-provenance - runnable on a stock hosted runner today.
  # ---------------------------------------------------------------------------
  prebuilt-provenance:
    name: X2 provenance for an operator-supplied image
    if: ${{ inputs.mode == 'prebuilt-provenance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require an artifact URL
        if: ${{ inputs.artifact_url == '' }}
        run: |
          echo "::error::mode=prebuilt-provenance needs artifact_url. Supply the HTTPS URL of an image you have reason to trust; note that no provenance-usable public prebuilt exists as of 2026-09-24 (docs/evidence/M2/x2-artifact-availability.txt)."
          exit 1

      - name: Download and hash the artifact
        env:
          URL: ${{ inputs.artifact_url }}
        run: |
          set -euo pipefail
          mkdir -p ./artifact
          echo "downloading: $URL"
          curl -fL --retry 3 --retry-delay 5 -o ./artifact/guest-image "$URL"
          ls -l ./artifact/guest-image
          sha256sum ./artifact/guest-image | tee ./artifact/guest-image.sha256

      - name: Write the X2 provenance record
        env:
          URL: ${{ inputs.artifact_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          p = pathlib.Path('artifact/guest-image')
          h = hashlib.sha256()
          with p.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)
          rec = {
              'criterion': 'M2 X2 - guest artifact provenance',
              'kind': 'operator-supplied-prebuilt',
              'download_url': os.environ['URL'],
              'sha256': h.hexdigest(),
              'bytes': p.stat().st_size,
              'retrieved_utc': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'provenance_anchor': 'image/manifest/arcadia-x86.pinned.xml (X1 per-project lock)',
              'manifest_pin': json.load(open('image/manifest/arcadia-x86.pin.json'))['manifest']['revision'],
              'retrieved_by': 'github-actions guest-build.yml (mode=prebuilt-provenance)',
              'note': 'REQUIRED: record how this image diverges from the pinned manifest. A prebuilt is not evidence of a build from the X1 lock - the lock remains the provenance anchor, and X2 is only closed once the divergence is stated.',
          }
          pathlib.Path('artifact/x2-provenance.json').write_text(json.dumps(rec, indent=2) + '\n')
          print(json.dumps(rec, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: m2-x2-provenance
          path: artifact/x2-provenance.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # mode=build-from-manifest - needs real disk; self-hosted, larger runner, or Crave.
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (disk/RAM/tools)
    if: ${{ inputs.mode == 'build-from-manifest' }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - uses: actions/checkout@v4

      - name: Check build capacity
        run: |
          set -euo pipefail
          avail_gb=$(( $(df -Pk . | awk 'NR==2 {print $4}') / 1024 / 1024 ))
          mem_gb=$(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1024 / 1024 ))
          echo "available disk: ${avail_gb} GB | RAM: ${mem_gb} GB | cpus: $(nproc)"
          missing=""
          for t in git python3 curl make; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ]; then echo "::error::missing build tools:$missing"; exit 1; fi
          if [ "$avail_gb" -lt 300 ]; then
            echo "::error::only ${avail_gb} GB free; a sync + build needs ~300+ GB. Use mode=prebuilt-provenance, point runner_label at a machine with the disk, or build on Crave (docs/M2-CRAVE-BUILD.md)."
            exit 1
          fi
          if [ "$mem_gb" -lt 15 ]; then
            echo "::error::only ${mem_gb} GB RAM; expect the AOSP build to be killed. 16 GB is the practical floor."
            exit 1
          fi
          echo "preflight OK"

  build-from-manifest:
    name: X2 build from the pinned manifest
    needs: preflight
    if: ${{ inputs.mode == 'build-from-manifest' }}
    runs-on: ${{ inputs.runner_label }}
    # GitHub caps hosted jobs at 6h; a from-source AOSP build can exceed that. Another
    # reason this mode belongs on a self-hosted runner or Crave.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve the manifest revision to build
        id: pin
        run: |
          set -euo pipefail
          rev="${{ inputs.manifest_revision }}"
          if [ -z "$rev" ]; then
            rev=$(python3 -c "import json;print(json.load(open('image/manifest/arcadia-x86.pin.json'))['manifest']['revision'])")
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "building manifest revision: $rev"

      # The whole build - pin, sync, lock re-confirmation, lunch/make, X2 record - is
      # this one script, shared with the Crave path so the two cannot diverge.
      - name: Build from the locked manifest
        env:
          LUNCH_TARGET: ${{ inputs.lunch_target }}
          MAKE_TARGET: ${{ inputs.make_target }}
          MANIFEST_REVISION: ${{ steps.pin.outputs.revision }}
          WORKSPACE: ${{ runner.workspace }}/aosp
        run: bash tools/guest-build/build-from-manifest.sh

      - name: Upload the X2 record + artifact manifest
        uses: actions/upload-artifact@v4
        with:
          name: m2-guest-image-provenance
          path: |
            image/out/x2-provenance.json
            image/out/artifacts.txt
            image/out/repo-manifest-r.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Where to go next
        run: |
          echo "X2 record uploaded. To close X2 and complete M2 (X3-X5), on a Windows 11 host with WHPX + QEMU:"
          echo "  1. fetch the image + x2-provenance.json from the build host (Crave: crave pull image/out/)"
          echo "  2. verify the image's sha256 against the record, and commit the record under docs/evidence/M2/"
          echo "  3. .\\tools\\qemu\\provision-host.ps1 -Check"
          echo "  4. .\\tools\\qemu\\launch-emberbird.ps1 -Image <path> -DryRun   # X3"
          echo "  5. .\\tools\\qemu\\launch-emberbird.ps1 -Image <path>          # X4"
          echo "  6. adb connect 127.0.0.1:58526                                 # X5"
